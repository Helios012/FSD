<html>
<head>
<title>CSS Position Demo</title>

<style>
body {
    height: 1500px; 
}
.box {
    width: 150px;
    height: 80px;
    color: white;
    text-align: center;
    line-height: 80px;
}

.static {
    position: static;
    background-color: gray;
}

.relative {
    position: relative;
    left: 50px;
    top: 20px;
    background-color: blue;
}

.container {
    position: relative;
    border: 2px solid black;
    height: 200px;
    margin-top: 20px;
}

.absolute {
    position: absolute;
    top: 20px;
    right: 20px;
    background-color: red;
}

.fixed {
    position: fixed;
    top: 10px;
    right: 10px;
    background-color: green;
}

.sticky {
    position: sticky;
    top: 0;
    background-color: orange;
}
</style>

</head>

<body>

<h2>CSS Position Properties Demo</h2>
<div class="box static">Static</div>
<div class="box relative">Relative</div>

<div class="container">
    Container
    <div class="box absolute">Absolute</div>
</div>

<div class="box fixed">Fixed</div>
<div class="box sticky">Sticky</div>
<p>Scroll down to see sticky and fixed behavior...</p>

</body>
</html>
