<!DOCTYPE html>
<html>
<head>
<style>
.container {
  position: relative;
  height: 300px;
  border: 1px solid black;
}

.box {
  height: 150px;
  width: 200px;
  background: red;
  color: white;
  font-size: 20px;
  padding: 10px;
  position: absolute;
  top: 50px;
  left: 50px;
}
</style>
</head>

<body>

<div class="container">
  <div class="box">
    I am Absolute Position
  </div>
</div>

</body>
</html>
