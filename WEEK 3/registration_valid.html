<!DOCTYPE html>
<html>
<head>
    <title>Registration Form Validation</title>

    <script>
        function validate() {

            var uname = document.getElementById("un").value;
            var email = document.getElementById("em").value;
            var password = document.getElementById("pwd").value;
            var mobile = document.getElementById("mb").value;

            // Regular Expressions
            var up = /^[A-Za-z0-9]{3,8}$/;
            var ep = /^[a-z0-9]+@[a-z]+\.[a-z]{2,3}$/;
            var pp = /^[A-Za-z0-9]{6,8}$/;
            var mp = /^[0-9]{10}$/;

            // Validation checks
            if (!uname.match(up)) {
                alert("Invalid username");
                return false;
            }

            if (!email.match(ep)) {
                alert("Invalid email");
                return false;
            }

            if (!password.match(pp)) {
                alert("Invalid password");
                return false;
            }

            if (!mobile.match(mp)) {
                alert("Invalid mobile number");
                return false;
            }

            alert("Success!");
            return true;
        }
    </script>
</head>

<body>
    <h2>Registration Form</h2>

    <form onsubmit="return validate()">
        Username: <input type="text" id="un"><br><br>
        Email: <input type="text" id="em"><br><br>
        Password: <input type="password" id="pwd"><br><br>
        Mobile: <input type="text" id="mb"><br><br>

        <input type="submit" value="Submit">
    </form>
</body>
</html>
