<html>
<head>
<title>Registration</title>
</head>
<body>
<h3 align="center">Registration</h3>
<form align="center">
Name: <input type="text" name="name"><br><br>
Password: <input type="password" name="pass"><br><br>
Email: <input type="email" name="email"><br><br>
Phone: <input type="text" name="phone"><br><br>
Sex:
<input type="radio" name="sex" value="male">Male
<input type="radio" name="sex" value="female">Female
<br><br>
DOB:
<input type="date" name="dob"><br><br>
Languages:
<input type="checkbox" name="tel">Telugu
<input type="checkbox" name="eng">English
<input type="checkbox" name="tam">Tamil
<input type="checkbox" name="hin">Hindi
<br><br>
Address:<br>
<textarea rows="3" cols="25" name="addr"></textarea><br><br>
<input type="submit" name="submit" value="Submit">
<input type="reset" name="reset" value="Reset">
<br><br>
<a href="week-1.html">Go Back</a>
</form>
</body>
</html>
