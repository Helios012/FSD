<!DOCTYPE html>
<html>
<head>
<title>Newspaper</title>

<style>
body { font-family: Arial; margin: 20px; }
h1 { text-align: center; }

.row { display: flex; gap: 20px; }

.box {
  flex: 1;
  border: 1px solid black;
  padding: 10px;
}
</style>
</head>

<body>

<h1>Daily News</h1>

<div class="row">

  <div class="box">
    <h3>Article 1</h3>
    <p>India wins cricket match against Australia in a thrilling final.</p>
  </div>

  <div class="box">
    <h3>Article 2</h3>
    <p>New technology in AI is changing the world rapidly.</p>
  </div>

</div>

</body>
</html>
