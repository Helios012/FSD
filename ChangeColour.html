<!DOCTYPE html>
<html>

<head>
<title>Change Color</title>
</head>

<body style="background-color: blue;">

<center>
<h1>Full Stack Development Lab</h1>
<button onclick="changeColor()">Change Color</button>
</center>

<script>
function changeColor() {
    document.body.style.backgroundColor = "green";
}
</script>

</body>
</html>
